<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Walking Skeleton - Login</title>
</head>
<body>
  <h2>Đăng nhập</h2>
  <form id="loginForm">
    <label>Username: <input type="text" id="username"></label><br><br>
    <label>Password: <input type="password" id="password"></label><br><br>
    <button type="submit">Đăng nhập</button>
  </form>
  <p id="result"></p>

  <script src="login.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const ok = login(user, pass);
      document.getElementById('result').textContent = ok ? 'Đăng nhập thành công!' : 'Sai tài khoản hoặc mật khẩu!';
    });
  </script>
</body>
</html>
